# All services share one Postgres database (separate tables) for now.
# ponytail: true DB-per-service (own Postgres each) lands with Phase 3 Terraform/Helm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: gateway
          env:
            - { name: ORDER_URL, value: "http://order:8080" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: app, key: JWT_SECRET } }
            - { name: AUTH_USER, value: "demo" }
            - { name: AUTH_PASS, value: "demo" }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
spec:
  replicas: 1
  selector: { matchLabels: { app: order } }
  template:
    metadata: { labels: { app: order } }
    spec:
      containers:
        - name: order
          image: order
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app, key: DATABASE_URL } }
            - { name: NATS_URL, value: "nats://nats:4222" }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  selector: { app: order }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
