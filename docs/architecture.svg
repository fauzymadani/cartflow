<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ===== connectors (drawn first, under the cards) ===== -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <!-- sync path -->
    <line x1="170" y1="83" x2="248" y2="83" marker-end="url(#arrow)"/>
    <line x1="430" y1="83" x2="518" y2="83" marker-end="url(#arrow)"/>
    <!-- order <-> bus -->
    <line x1="585" y1="111" x2="585" y2="173" marker-end="url(#arrow)"/>
    <line x1="640" y1="175" x2="640" y2="113" marker-end="url(#arrow)"/>
    <!-- bus -> consumers -->
    <line x1="140" y1="225" x2="140" y2="263" marker-end="url(#arrow)"/>
    <line x1="430" y1="225" x2="430" y2="263" marker-end="url(#arrow)"/>
    <line x1="720" y1="225" x2="720" y2="263" marker-end="url(#arrow)"/>
    <!-- inventory -> postgres -->
    <line x1="140" y1="325" x2="140" y2="373" marker-end="url(#arrow)"/>
    <!-- notification -> jaeger (traces) -->
    <line x1="720" y1="325" x2="720" y2="373" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  </g>

  <!-- ===== nodes ===== -->
  <!-- Client -->
  <rect x="40" y="55" width="130" height="56" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="105" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Client</text>
  <text x="105" y="99" text-anchor="middle" font-size="11" fill="#64748b">REST / JSON</text>

  <!-- API Gateway -->
  <rect x="250" y="55" width="180" height="56" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="340" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">API Gateway</text>
  <text x="340" y="99" text-anchor="middle" font-size="11" fill="#64748b">JWT auth &#183; REST edge</text>

  <!-- Order -->
  <rect x="520" y="55" width="180" height="56" rx="12" fill="#ffffff" stroke="#00ADD8" stroke-width="1.6"/>
  <text x="610" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Order</text>
  <text x="610" y="99" text-anchor="middle" font-size="11" fill="#64748b">gRPC &#183; Go</text>

  <!-- NATS bus -->
  <rect x="40" y="175" width="820" height="50" rx="12" fill="#10b981"/>
  <text x="450" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">NATS JetStream &#8212; durable event bus</text>

  <!-- Inventory -->
  <rect x="40" y="263" width="200" height="62" rx="12" fill="#ffffff" stroke="#00ADD8" stroke-width="1.6"/>
  <text x="140" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Inventory</text>
  <text x="140" y="309" text-anchor="middle" font-size="11" fill="#64748b">reserve / release</text>

  <!-- Payment -->
  <rect x="330" y="263" width="200" height="62" rx="12" fill="#ffffff" stroke="#00ADD8" stroke-width="1.6"/>
  <text x="430" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Payment</text>
  <text x="430" y="309" text-anchor="middle" font-size="11" fill="#64748b">charge (mock)</text>

  <!-- Notification -->
  <rect x="620" y="263" width="200" height="62" rx="12" fill="#ffffff" stroke="#00ADD8" stroke-width="1.6"/>
  <text x="720" y="291" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Notification</text>
  <text x="720" y="309" text-anchor="middle" font-size="11" fill="#64748b">notify</text>

  <!-- PostgreSQL -->
  <rect x="40" y="373" width="200" height="54" rx="12" fill="#ffffff" stroke="#4169E1" stroke-width="1.6"/>
  <text x="140" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="140" y="416" text-anchor="middle" font-size="11" fill="#64748b">shared: Order + Inventory</text>

  <!-- Jaeger -->
  <rect x="620" y="373" width="200" height="54" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
  <text x="720" y="399" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Jaeger</text>
  <text x="720" y="416" text-anchor="middle" font-size="11" fill="#64748b">OpenTelemetry traces</text>

  <!-- ===== edge labels (white chips) ===== -->
  <g font-size="10.5" fill="#475569" text-anchor="middle">
    <g><rect x="188" y="74" width="44" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="210" y="86.5">REST</text></g>
    <g><rect x="452" y="74" width="46" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="475" y="86.5">gRPC</text></g>
    <g><rect x="541" y="133" width="88" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="585" y="145.5">order.created</text></g>
    <g><rect x="616" y="133" width="48" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="640" y="145.5">settle</text></g>
    <g><rect x="96" y="235" width="88" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="140" y="247.5">order.created</text></g>
    <g><rect x="372" y="235" width="116" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="430" y="247.5">inventory.reserved</text></g>
    <g><rect x="668" y="235" width="104" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="720" y="247.5">terminal events</text></g>
    <g><rect x="118" y="340" width="44" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="140" y="352.5">SQL</text></g>
    <g><rect x="696" y="340" width="48" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/><text x="720" y="352.5">OTLP</text></g>
  </g>

  <!-- caption -->
  <g text-anchor="middle">
    <rect x="230" y="447" width="440" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="450" y="463" font-size="11.5" fill="#475569">Trace context rides in NATS headers &#8212; one connected trace per order across every service.</text>
  </g>
</svg>
